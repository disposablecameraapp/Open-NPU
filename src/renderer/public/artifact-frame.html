<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Hosts generated pages: scripts and inline styles run, every network request is blocked. The app's own CSP would also block them. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:" />
    <script>
      // The window sends the page; this frame answers once the page is painted (so the old frame is only replaced by a frame that shows something)
      // and tells where the reader is in the page, so the next frame opens at the same place instead of at the top.
      var key = null, at = { y: 0, bottom: false };
      function here() {
        var el = document.scrollingElement || document.documentElement;
        if (!el) return;
        at = { y: el.scrollTop, bottom: el.scrollHeight - el.scrollTop - el.clientHeight < 40 && el.scrollTop > 0 };
        parent.postMessage({ npuScroll: at, key: key }, "*");
      }
      window.addEventListener("message", function (e) {
        if (!e.data || typeof e.data.html !== "string") return;
        key = e.data.key;
        document.open();
        document.write(e.data.html);
        document.close();
        if (e.data.still) {
          // a page still being written: nothing moves, so each redraw looks like the page growing, not a page starting over
          var s = document.createElement("style");
          s.textContent = "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}[data-aos]{opacity:1!important;transform:none!important}";
          (document.head || document.documentElement).appendChild(s);
        }
        var to = e.data.scroll;
        var settle = function () {
          var el = document.scrollingElement || document.documentElement;
          if (to && el) el.scrollTop = to.bottom ? el.scrollHeight : to.y;
        };
        settle();
        window.addEventListener("scroll", here, { passive: true });
        requestAnimationFrame(function () { settle(); requestAnimationFrame(function () { parent.postMessage({ npuPainted: true, key: key }, "*"); }); });
        // images and fonts inside the page: it is placed again once they are there
        window.addEventListener("load", settle);
      });
    </script>
  </head>
  <body></body>
</html>
