<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Hosts generated pages: scripts and inline styles run, every network request is blocked. The app's own CSP would also block them. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:" />
    <script>
      window.addEventListener("message", function (e) {
        if (!e.data || typeof e.data.html !== "string") return;
        document.open();
        document.write(e.data.html);
        document.close();
        // say when the page has really been drawn (the scripts have run and a few frames have passed), so the window shows this frame only then and never a blank or half-drawn one
        var frames = 0;
        (function tick() {
          if (++frames < 4) { requestAnimationFrame(tick); return; }
          try { parent.postMessage({ npuPainted: true }, "*"); } catch (err) { /* no parent */ }
        })();
      });
    </script>
  </head>
  <body></body>
</html>
