<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Hosts generated pages: scripts and inline styles run, every network request is blocked. The app's own CSP would also block them. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:" />
    <script>
      // The window sends the page; this frame answers once the page is painted (so the old frame is only replaced by a frame that shows something)
      // and tells where the reader is in the page, so the next frame opens at the same place instead of at the top.
      var key = null, at = { y: 0, bottom: false };
      // The page drawing itself costs the graphics chip, the battery and the fan. Frames are handed to the page at most 60 times a second while the reader plays it (the pointer is over it or it has
      // the keyboard), about 15 a second while the reader is elsewhere in the app, and about 2 while the window does not have the focus. A screen that refreshes 120 times a second no longer doubles it.
      var GAP = { play: 15, watch: 66, away: 500 }, attended = "play", nid = 0, queue = {}, pumping = false, lastRun = 0, realRaf = window.requestAnimationFrame.bind(window);
      function pump(t) {
        pumping = false;
        if (t - lastRun < GAP[attended]) { schedule(); return; }
        lastRun = t;
        var now = queue; queue = {};
        for (var k in now) { try { now[k](t); } catch (err) { setTimeout(function () { throw err; }, 0); } }
        for (var any in queue) { schedule(); break; }
      }
      function schedule() { if (!pumping) { pumping = true; realRaf(pump); } }
      window.requestAnimationFrame = function (cb) { var id = ++nid; queue[id] = cb; schedule(); return id; };
      window.cancelAnimationFrame = function (id) { delete queue[id]; };
      function here() {
        var el = document.scrollingElement || document.documentElement;
        if (!el) return;
        at = { y: el.scrollTop, bottom: el.scrollHeight - el.scrollTop - el.clientHeight < 40 && el.scrollTop > 0 };
        parent.postMessage({ npuScroll: at, key: key }, "*");
      }
      function onAttention(e) { if (e.data && GAP[e.data.npuAttention]) attended = e.data.npuAttention; }
      window.addEventListener("message", function (e) {
        if (!e.data || typeof e.data.html !== "string") return;
        if (GAP[e.data.attended]) attended = e.data.attended;
        key = e.data.key;
        document.open();
        document.write(e.data.html);
        document.close();
        window.addEventListener("message", onAttention); // writing the page dropped every listener of the window: this one is how the window says whether anyone is looking
        if (e.data.still) {
          // a page still being written: nothing moves, so each redraw looks like the page growing, not a page starting over
          var s = document.createElement("style");
          s.textContent = "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}[data-aos]{opacity:1!important;transform:none!important}";
          (document.head || document.documentElement).appendChild(s);
        }
        var to = e.data.scroll;
        var settle = function () {
          var el = document.scrollingElement || document.documentElement;
          if (to && el) el.scrollTop = to.bottom ? el.scrollHeight : to.y;
          // a deck being changed: the slide that changes stays in view, whatever the old place was
          var sl = typeof e.data.focus === "number" ? document.querySelector('.slide[data-i="' + e.data.focus + '"]') : null;
          if (sl && el) {
            var r = sl.getBoundingClientRect();
            if (r.top < 40 || r.bottom > window.innerHeight) el.scrollTop = el.scrollTop + r.top - Math.max(40, (window.innerHeight - r.height) / 2);
          }
        };
        settle();
        window.addEventListener("scroll", here, { passive: true });
        requestAnimationFrame(function () { settle(); requestAnimationFrame(function () { parent.postMessage({ npuPainted: true, key: key }, "*"); }); });
        // images and fonts inside the page: it is placed again once they are there
        window.addEventListener("load", settle);
      });
    </script>
  </head>
  <body></body>
</html>
